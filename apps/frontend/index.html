<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otimizador de Limites | Banco PAN</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: {} } };
    </script>

    <!-- React 18 + Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Força o runtime JSX "classic" (React.createElement). Sem isto, o Babel
         injeta `import ... from "react/jsx-runtime"` e quebra como script clássico. -->
    <script>
      Babel.registerPreset("react-classic", {
        presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
      });
    </script>

    <!-- p5.js: renderização dos gráficos em canvas com animações e interações -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body class="bg-[#E2EAF4] text-[#0D1B2A] antialiased">
    <div id="root"></div>

    <!-- Globais: helpers de formatação e metadados de UI -->
    <script src="data.js?v=2"></script>
    <!-- URL base da API: ajuste para o domínio de produção se necessário -->
    <script>
      window.API_BASE_URL = window.API_BASE_URL || "http://127.0.0.1:8000/api";
    </script>
    <script src="runtime-config.js?v=2"></script>
    <!-- Cliente HTTP para o backend FastAPI -->
    <script src="api.js?v=2"></script>

    <!-- Páginas (JSX compilado pelo Babel em runtime) -->
    <!-- Ordem importa: Resultados.js define BarChartSVG/DonutChart usados em GerarLimites.js,
         mas como os componentes são referenciados só em tempo de render (não de parse),
         a ordem abaixo é suficiente. -->
    <script type="text/babel" data-presets="react-classic" src="pages/Navbar.js?v=3"></script>
    <script type="text/babel" data-presets="react-classic" src="pages/Cockpit.js?v=3"></script>
    <script type="text/babel" data-presets="react-classic" src="pages/GerarLimites.js?v=3"></script>
    <script type="text/babel" data-presets="react-classic" src="pages/Resultados.js?v=3"></script>
    <script type="text/babel" data-presets="react-classic" src="pages/Clientes.js?v=3"></script>
    <script type="text/babel" data-presets="react-classic" src="pages/ConfigModal.js?v=3"></script>

    <!-- App raiz -->
    <script type="text/babel" data-presets="react-classic">
      // Captura erros de render e exibe mensagem legível em vez de tela branca.
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { error: null, info: null };
        }
        static getDerivedStateFromError(e) {
          return { error: e };
        }
        componentDidCatch(error, info) {
          this.setState({ info: info });
        }
        render() {
          if (this.state.error) {
            return (
              <div className="bg-red-50 border border-red-300 p-6 text-sm text-red-700 space-y-2">
                <p className="font-bold">Erro ao renderizar a página:</p>
                <pre className="whitespace-pre-wrap text-xs font-mono bg-red-100 p-3 rounded">
                  {String(this.state.error)}
                </pre>
                {this.state.info && (
                  <pre className="whitespace-pre-wrap text-xs font-mono text-red-400">
                    {this.state.info.componentStack}
                  </pre>
                )}
              </div>
            );
          }
          return this.props.children;
        }
      }

      var App = function () {
        // Página ativa. Possíveis valores: "dashboard" | "gerar" | "resultados" | "clientes"
        var [page, setPage] = React.useState("dashboard");

        // Controla a abertura do modal de configurações
        var [cfgOpen, setCfgOpen] = React.useState(false);

        // Renderiza a página correspondente à chave ativa.
        // key={page} no ErrorBoundary garante que o componente é remontado a
        // cada navegação, recarregando dados frescos da API automaticamente.
        function renderPage(p) {
          if (p === "dashboard") return <Cockpit setPage={setPage} />;
          if (p === "gerar") return <GerarLimites setPage={setPage} />;
          if (p === "resultados") return <Resultados setPage={setPage} />;
          if (p === "clientes") return <Clientes setPage={setPage} />;
          return null;
        }

        return (
          <div className="min-h-screen bg-[#E2EAF4]">
            <Navbar
              page={page}
              setPage={setPage}
              onConfig={function () {
                setCfgOpen(true);
              }}
            />
            <main className="pt-14">
              <div className="max-w-7xl mx-auto px-8 py-8">
                <ErrorBoundary key={page}>{renderPage(page)}</ErrorBoundary>
              </div>
            </main>
            {cfgOpen && (
              <ConfigModal
                onClose={function () {
                  setCfgOpen(false);
                }}
              />
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
