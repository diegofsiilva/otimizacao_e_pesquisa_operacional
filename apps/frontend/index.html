<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Credito - Banco PAN</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {} } }
  </script>

  <!-- React 18 + Babel + Recharts via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    /* Range slider cross-browser */
    .slider-range { -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#e2e8f0; border-radius:3px; outline:none; }
    .slider-range::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#0ea5e9; border:2px solid #fff; box-shadow:0 0 0 1px #0ea5e9; cursor:pointer; }
    .slider-range::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#0ea5e9; border:2px solid #fff; cursor:pointer; }

    /* Upload zone hover */
    .upload-zone { transition: all .2s; }

    /* Modal animation */
    .modal-enter { animation: fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity:0; transform:scale(.97) } to { opacity:1; transform:scale(1) } }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
  </style>
</head>
<body class="bg-[#DDD9CC] text-slate-900 antialiased">

  <div id="root"></div>

  <!-- dados globais (JS puro) -->
  <script src="data.js"></script>

  <!-- paginas (JSX via Babel) -->
  <script type="text/babel" src="pages/Navbar.js"></script>
  <script type="text/babel" src="pages/Dashboard.js"></script>
  <script type="text/babel" src="pages/GerarLimites.js"></script>
  <script type="text/babel" src="pages/Resultados.js"></script>
  <script type="text/babel" src="pages/ConfigModal.js"></script>

  <!-- App raiz -->
  <script type="text/babel">
    var App = function() {
      var s1 = React.useState('dashboard');
      var page = s1[0]; var setPage = s1[1];
      var s2 = React.useState(false);
      var cfgOpen = s2[0]; var setCfgOpen = s2[1];

      var views = {
        dashboard:  <Dashboard />,
        gerar:      <GerarLimites setPage={setPage} />,
        resultados: <Resultados />,
      };

      return (
        <div className="min-h-screen bg-[#DDD9CC] flex">
          <Navbar page={page} setPage={setPage} onConfig={function(){ setCfgOpen(true); }} />
          <main className="ml-56 flex-1 p-8" style={{ maxWidth: '1200px' }}>
            {views[page]}
          </main>
          {cfgOpen && <ConfigModal onClose={function(){ setCfgOpen(false); }} />}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
